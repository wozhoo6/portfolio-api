
name: nightly-rollup

on:
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rollup
        env:
          API_URL: ${{ secrets.API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            -X POST "$API_URL/api/admin/rollup" \
            -H "X-Admin-Token: $ADMIN_TOKEN"
